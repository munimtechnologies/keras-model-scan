name: "model-file-scan"
description: >-
  Static, no-execution security scan for ML model files (.keras, .h5, pickle,
  .pt, .joblib, .npy, safetensors, GGUF), with optional SARIF upload to GitHub
  code scanning. Never loads, imports, unpickles or executes a model.
author: "MV2 of Munim, Inc."
branding:
  icon: "shield"
  color: "blue"

inputs:
  paths:
    description: "Space-separated files or directories to scan."
    required: false
    default: "."
  fail-on:
    description: "Minimum severity that fails the job: critical, high, medium, low or info."
    required: false
    default: "high"
  sarif-file:
    description: "Where to write the SARIF report."
    required: false
    default: "model-file-scan.sarif"
  upload-sarif:
    description: "Upload the SARIF report to GitHub code scanning (needs security-events: write)."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Scan model files
      id: scan
      shell: bash
      run: |
        set +e
        python3 "${{ github.action_path }}/model_file_scan.py" ${{ inputs.paths }} \
          --sarif --fail-on "${{ inputs.fail-on }}" > "${{ inputs.sarif-file }}"
        echo "code=$?" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: model-file-scan

    - name: Fail if issues found
      if: ${{ steps.scan.outputs.code != '0' }}
      shell: bash
      run: |
        echo "::error::model-file-scan found model files with issues at or above '${{ inputs.fail-on }}'. See the Security tab or the SARIF report."
        exit 1
